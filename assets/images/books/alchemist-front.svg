<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580">
    <defs>
      <linearGradient id="frontBg_alchemist" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#78350F" />
        <stop offset="100%" stop-color="#451A03" />
      </linearGradient>
      <linearGradient id="spineShade" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.4" />
        <stop offset="70%" stop-color="#000000" stop-opacity="0.05" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
      </linearGradient>
      <filter id="glow_alchemist">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Book Background -->
    <rect width="400" height="580" rx="8" fill="url(#frontBg_alchemist)" />
    <!-- Spine realistic overlay -->
    <rect x="0" y="0" width="36" height="580" fill="url(#spineShade)" />
    <!-- Decorative Frame -->
    <rect x="44" y="30" width="326" height="520" rx="6" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
    <rect x="52" y="38" width="310" height="504" rx="4" fill="none" stroke="#FEF3C7" stroke-width="0.8" opacity="0.4"/>
    
    <!-- Publisher Stamp -->
    <g transform="translate(60, 50)">
      <circle cx="16" cy="16" r="14" fill="#FBBF24" opacity="0.2" />
      <text x="36" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#FEF3C7" letter-spacing="2">RAJ PUBLICATION</text>
    </g>

    <!-- Visual Motif -->
    <circle cx="200" cy="170" r="18" fill="#FBBF24"/><line x1="200" y1="140" x2="200" y2="148" stroke="#FBBF24" stroke-width="3"/><line x1="200" y1="192" x2="200" y2="200" stroke="#FBBF24" stroke-width="3"/><line x1="170" y1="170" x2="178" y2="170" stroke="#FBBF24" stroke-width="3"/><line x1="222" y1="170" x2="230" y2="170" stroke="#FBBF24" stroke-width="3"/>

    <!-- Tamil Title -->
    <text x="207" y="240" font-family="'Noto Sans Tamil', serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" filter="url(#glow_alchemist)">
      ஆல்கெமிஸ்ட்
    </text>
    
    <!-- Subtitle -->
    <text x="207" y="275" font-family="'Noto Sans Tamil', sans-serif" font-weight="500" font-size="14" fill="#FEF3C7" text-anchor="middle">
      கனவுகளைத் தேடிய மாபெரும் பயணம்
    </text>

    <!-- English Title -->
    <text x="207" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">
      THE ALCHEMIST
    </text>

    <!-- Divider -->
    <line x1="120" y1="325" x2="294" y2="325" stroke="#FBBF24" stroke-width="1.5" />
    <circle cx="207" cy="325" r="4" fill="#FBBF24" />

    <!-- Author Section -->
    <text x="207" y="375" font-family="'Noto Sans Tamil', sans-serif" font-weight="600" font-size="13" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">
      எழுத்தாளர் / AUTHOR
    </text>
    <text x="207" y="405" font-family="'Noto Sans Tamil', serif" font-weight="800" font-size="22" fill="#FFFFFF" text-anchor="middle">
      பாவ்லோ கொய்லோ
    </text>
    <text x="207" y="428" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#CBD5E1" text-anchor="middle">
      (Paulo Coelho)
    </text>

    <!-- Gold Foil Badge -->
    <g transform="translate(145, 465)">
      <rect width="124" height="32" rx="16" fill="#FBBF24" />
      <text x="62" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle" letter-spacing="1">ORIGINAL PRINT</text>
    </g>

    <!-- Bottom Watermark -->
    <text x="207" y="525" font-family="sans-serif" font-size="10" fill="#FEF3C7" opacity="0.6" text-anchor="middle">
      [முன் அட்டை • FRONT COVER]
    </text>
  </svg>