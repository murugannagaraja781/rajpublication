<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bgGrad_17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad_17" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Book Base Background -->
  <rect width="400" height="600" rx="16" fill="url(#bgGrad_17)" />
  
  <!-- Spine Shadow Simulation -->
  <rect x="0" y="0" width="36" height="600" fill="#000000" opacity="0.35" />
  <line x1="36" y1="0" x2="36" y2="600" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
  
  <!-- Outer Gold Border -->
  <rect x="52" y="24" width="324" height="552" rx="12" fill="none" stroke="url(#goldGrad_17)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.8" />
  <rect x="60" y="32" width="308" height="536" rx="8" fill="none" stroke="#34D399" stroke-width="1" opacity="0.4" />

  <!-- Publisher Header -->
  <g transform="translate(214, 65)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="16" fill="url(#goldGrad_17)" letter-spacing="2">
      RAJ PUBLICATION
    </text>
    <text y="20" text-anchor="middle" font-family="'Noto Sans Tamil', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="1">
      போட்டித் தேர்வு வழிகாட்டி
    </text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(214, 120)">
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#059669" />
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" letter-spacing="1">
      TET / TRB EXAM
    </text>
  </g>

  <!-- Center Emblem / Graphic -->
  <g transform="translate(214, 230)">
    <circle cx="0" cy="0" r="50" fill="url(#goldGrad_17)" opacity="0.15" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#goldGrad_17)" stroke-width="2" stroke-dasharray="4 2" />
    <!-- Open Book Vector -->
    <path d="M 0 5 Q -18 0 -32 5 L -32 32 Q -18 28 0 32 Z" fill="url(#goldGrad_17)" />
    <path d="M 0 5 Q 18 0 32 5 L 32 32 Q 18 28 0 32 Z" fill="#FEF3C7" />
    <line x1="0" y1="5" x2="0" y2="33" stroke="#92400E" stroke-width="2" />
    <circle cx="0" cy="-12" r="5" fill="#FBBF24" />
  </g>

  <!-- Book Title (Tamil) -->
  <g transform="translate(214, 335)">
    <foreignObject x="-140" y="0" width="280" height="110">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Noto Sans Tamil', -apple-system, sans-serif; font-size: 19px; font-weight: 800; color: #FFFFFF; text-align: center; line-height: 1.35; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">
        TN - TET PAPER - I கணிதம்
      </div>
    </foreignObject>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="460" x2="308" y2="460" stroke="url(#goldGrad_17)" stroke-width="1.5" opacity="0.6" />

  <!-- Pricing Tag / Details -->
  <g transform="translate(214, 495)">
    
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="24" fill="#34D399">
      ₹840
    </text>
    
    <text text-anchor="middle" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#94A3B8" text-decoration="line-through">
      MRP: ₹1200 (30% OFF)
    </text>
    
    
  </g>

  <!-- Bottom SKU / ISBN footer -->
  <g transform="translate(214, 550)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748B">
      SKU: 10038 | ISBN: 9788168605336
    </text>
  </g>
</svg>