<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>பக்கம் கிடைக்கவில்லை (Page Not Found) | Raj Publication</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .notfound-wrap {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .notfound-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
    }
    .notfound-code {
      font-size: 5rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
      font-family: var(--font-sans);
    }
  </style>
</head>
<body>
  <div class="notfound-wrap">
    <div class="notfound-card">
      <div class="notfound-code">404</div>
      <h1 style="font-size:1.5rem;font-weight:800;color:var(--primary);margin-bottom:12px;">பக்கம் கிடைக்கவில்லை</h1>
      <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:28px;">
        மன்னிக்கவும்! நீங்கள் தேடிய பக்கம் மாற்றப்பட்டிருக்கலாம் அல்லது நீக்கப்பட்டிருக்கலாம்.
      </p>
      <a href="index.html" class="btn-primary" style="display:inline-flex;">
        <span>முகப்பிற்குத் திரும்புக (Go Home)</span>
      </a>
    </div>
  </div>
</body>
</html>
